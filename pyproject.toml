[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "near-duplicate-finder"
version = "1.0.0"
description = "Find near-duplicate pages with text shingling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "near", "duplicate", "finder"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/near-duplicate-finder"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
near-duplicate-finder = "near_duplicate_finder.cli:main"

[tool.setuptools]
packages = ["near_duplicate_finder"]
